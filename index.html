<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070910" />
  <title>Project Echo — Battle UI Prototype</title>

  <link rel="stylesheet" href="./src/battle-ui.css" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./public/assets/pwa/icon-192.png" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>

<body>
  <main
    id="battle-root"
    class="battle-shell"
    aria-label="Project Echo battle UI"
  ></main>

  <script type="module">
    const root = document.getElementById("battle-root");

    try {
      // DEVELOPMENT CLEANUP:
      // Remove any previously installed Project Echo service worker.
      if ("serviceWorker" in navigator) {
        const registrations =
          await navigator.serviceWorker.getRegistrations();

        await Promise.all(
          registrations.map(registration => registration.unregister())
        );
      }

      // Remove old service-worker caches.
      if ("caches" in window) {
        const cacheNames = await caches.keys();

        await Promise.all(
          cacheNames.map(name => caches.delete(name))
        );
      }

      // Load a fresh copy of the battle UI.
      await import("./src/battle-ui.js?v=4");

    } catch (error) {
      console.error("PROJECT ECHO BOOT ERROR:", error);

      // Show errors on-screen instead of leaving a black page.
      root.innerHTML = `
        <pre style="
          color:#ff7070;
          background:#080a10;
          padding:24px;
          white-space:pre-wrap;
          font:16px monospace;
        ">PROJECT ECHO BOOT ERROR

${String(error.stack || error)}</pre>
      `;
    }
  </script>
</body>
</html>
